version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: jobqueue-postgres
    environment:
      POSTGRES_USER: maheshjq
      POSTGRES_PASSWORD: mahesh123
      POSTGRES_DB: jobqueue
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maheshjq -d jobqueue"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: jobqueue-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: jobqueue-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://maheshjq:mahesh123@postgres:5432/jobqueue
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx tsx src/server.ts"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: jobqueue-worker
    environment:
      DATABASE_URL: postgresql://maheshjq:mahesh123@postgres:5432/jobqueue
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
